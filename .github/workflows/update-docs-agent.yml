name: Update Docs

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-run every page even if its source is unchanged
        type: boolean
        default: false
  repository_dispatch:
    types: [swiftlys2-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-docs-agent
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SWIFTLYCHAN_PAT }}
          persist-credentials: false # token must not sit in .git/config while the agent runs

      - name: Checkout swiftly-solution/swiftlys2 (stable)
        uses: actions/checkout@v4
        with:
          repository: swiftly-solution/swiftlys2
          ref: master
          token: ${{ secrets.SWIFTLYCHAN_PAT }}
          persist-credentials: false
          path: swiftlys2-src

      - name: Checkout swiftly-solution/swiftlys2 (beta)
        uses: actions/checkout@v4
        with:
          repository: swiftly-solution/swiftlys2
          ref: beta
          token: ${{ secrets.SWIFTLYCHAN_PAT }}
          persist-credentials: false
          path: swiftlys2-beta

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore source hashes
        uses: actions/cache@v4
        with:
          path: tools/docs-agent/hashes.json
          key: docs-agent-hashes-${{ github.run_id }}
          restore-keys: docs-agent-hashes-

      - name: Run agent for every page
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          dotnet build -c Release tools/docs-agent -o "$RUNNER_TEMP/agent"
          : > "$RUNNER_TEMP/body.md"
          jq -c '.[]' tools/docs-agent/pages.json | while read -r p; do
            slug=$(jq -r .slug <<<"$p"); page=$(jq -r .page <<<"$p")
            flag=""; [ "$(jq -r .upstream <<<"$p")" = true ] && flag="--allow-upstream"
            scope=$(jq -r '.scope // empty' <<<"$p"); [ -n "$scope" ] && flag="$flag --scope $scope"
            watch=$(jq -r '(.watch // []) | join(",")' <<<"$p"); [ -n "$watch" ] && flag="$flag --watch $watch"
            [ "$FORCE" = true ] && flag="$flag --force"
            echo "::group::$slug"
            # one failing page must not block the others
            if dotnet "$RUNNER_TEMP/agent/docs-agent.dll" --page "$page" --src swiftlys2-src --beta-src swiftlys2-beta \
                 --task "$(jq -r .task <<<"$p")" --summary "$RUNNER_TEMP/$slug.md" --slug "$slug" --hash-file tools/docs-agent/hashes.json $flag </dev/null; then
              # no summary file means the page was skipped as unchanged
              [ -f "$RUNNER_TEMP/$slug.md" ] && printf '### `%s`\n\n%s\n\n' "$page" "$(cat "$RUNNER_TEMP/$slug.md")" >> "$RUNNER_TEMP/body.md"
            else
              echo "::warning::agent failed for $slug"
            fi
            echo "::endgroup::"
          done

      - name: Open PRs
        env:
          GH_TOKEN: ${{ secrets.SWIFTLYCHAN_PAT }}
        run: |
          git config --global user.name "swiftlychan"
          git config --global user.email "swiftlychan@swiftlys2.net"
          git config --global core.hooksPath /dev/null  # agent-written files must never run as hooks
          # push credentials are only configured now, after the agent is done
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          git -C swiftlys2-src remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/swiftly-solution/swiftlys2"
          BRANCH="docs-agent/sync"
          BODY="$(cat "$RUNNER_TEMP/body.md")"$'\n'"_Generated by the DeepSeek docs agent. Review before merging._"

          # open_pr <repo> <dir> <title> <paths...>; one branch + one PR per repo, branch force-updated, PR created once.
          open_pr() {
            repo=$1; dir=$2; title=$3; shift 3
            git -C "$dir" add -- "$@"
            git -C "$dir" diff --cached --quiet && { echo "No changes in $repo."; return; }
            git -C "$dir" checkout -B "$BRANCH"
            git -C "$dir" commit -m "$title"
            git -C "$dir" push --force origin "$BRANCH"
            if [ -z "$(gh pr list --repo "$repo" --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
              (cd "$dir" && gh pr create --repo "$repo" --head "$BRANCH" --title "$title" --body "$BODY")
            fi
          }

          open_pr "${{ github.repository }}" . "docs: sync resource pages with SwiftlyS2 source" docs
          open_pr swiftly-solution/swiftlys2 swiftlys2-src "fix(configs): sync example configs with code" plugin_files/configs
