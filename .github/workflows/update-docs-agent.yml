name: Update Docs

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [swiftlys2-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-docs-agent
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slug: core-config
            page: docs/resources/core-config.mdx
            upstream: true
            task: |
              Update the page from the core configuration code in the SwiftlyS2 codebase (find where core.jsonc
              options are registered/defined) and from plugin_files/configs/core.example.jsonc.
              Code is the source of truth for keys, types and defaults.
              If core.example.jsonc differs from the code (missing/extra/renamed keys, wrong defaults),
              fix it with write_upstream_file.
          - slug: console-filter
            page: docs/resources/console-filter.mdx
            upstream: false
            task: |
              Use plugin_files/configs/confilter.example.jsonc (and the console filter code that loads it)
              to explain the console filter config file format, its rules and the `sw confilter` commands.
              Note the config path in the page may be wrong; verify it in the code.
          - slug: cli-options
            page: docs/resources/cli-options.mdx
            upstream: false
            task: |
              Find every command-line option the C++/native code reads, e.g.
              `CommandLine()->ParmValue(CUtlStringToken("-sw_logpath"), WIN_LINUX("addons\\swiftlys2\\logs", "addons/swiftlys2/logs"))`
              where the token is the CLI option and the second argument is the default value.
              Also look for other CommandLine() accessors (HasParm, ParmValue, CheckParm, ...) using sw_ options.
              Update the options table (option, example, details incl. default and accepted values).
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SWIFTLYCHAN_PAT }}
          persist-credentials: false # token must not sit in .git/config while the agent runs

      - name: Checkout swiftly-solution/swiftlys2 (stable)
        uses: actions/checkout@v4
        with:
          repository: swiftly-solution/swiftlys2
          ref: master
          token: ${{ secrets.SWIFTLYCHAN_PAT }}
          persist-credentials: false
          path: swiftlys2-src

      - name: Checkout swiftly-solution/swiftlys2 (beta)
        uses: actions/checkout@v4
        with:
          repository: swiftly-solution/swiftlys2
          ref: beta
          token: ${{ secrets.SWIFTLYCHAN_PAT }}
          persist-credentials: false
          path: swiftlys2-beta

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PAGE: ${{ matrix.page }}
          TASK: ${{ matrix.task }}
          UPSTREAM: ${{ matrix.upstream }}
        run: |
          dotnet run -c Release --project tools/docs-agent -- \
            --page "$PAGE" --src swiftlys2-src --beta-src swiftlys2-beta \
            --task "$TASK" --summary "$RUNNER_TEMP/summary.md" \
            $([ "$UPSTREAM" = true ] && echo --allow-upstream)

      - name: Open PRs
        env:
          GH_TOKEN: ${{ secrets.SWIFTLYCHAN_PAT }}
          SLUG: ${{ matrix.slug }}
          PAGE: ${{ matrix.page }}
        run: |
          git config --global user.name "swiftlychan"
          git config --global user.email "swiftlychan@swiftlys2.net"
          git config --global core.hooksPath /dev/null  # agent-written files must never run as hooks
          # push credentials are only configured now, after the agent is done
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          git -C swiftlys2-src remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/swiftly-solution/swiftlys2"
          BRANCH="docs-agent/$SLUG"
          BODY="$(cat "$RUNNER_TEMP/summary.md")"$'\n\n'"_Generated by the DeepSeek docs agent. Review before merging._"

          # open_pr <repo> <dir> <title> <paths...>; branch is force-updated, PR created once.
          open_pr() {
            repo=$1; dir=$2; title=$3; shift 3
            git -C "$dir" add -- "$@"
            git -C "$dir" diff --cached --quiet && { echo "No changes in $repo."; return; }
            git -C "$dir" checkout -B "$BRANCH"
            git -C "$dir" commit -m "$title"
            git -C "$dir" push --force origin "$BRANCH"
            if [ -z "$(gh pr list --repo "$repo" --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
              (cd "$dir" && gh pr create --repo "$repo" --head "$BRANCH" --title "$title" --body "$BODY")
            fi
          }

          open_pr "${{ github.repository }}" . "docs($SLUG): sync with SwiftlyS2 source" "$PAGE"
          open_pr swiftly-solution/swiftlys2 swiftlys2-src "fix(configs): sync example configs with code" plugin_files/configs
